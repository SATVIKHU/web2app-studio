name: Build Android APK Engine

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Target Website URL'
        required: true
        default: 'https://example.com'
      app_name:
        description: 'App Name'
        required: true
        default: 'PIKACHU'
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.satvik.app'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Clean Android Project
        run: |
          mkdir -p simple_project/app/src/main/java/com/satvik/engine
          mkdir -p simple_project/app/src/main/res/layout
          mkdir -p simple_project/app/src/main/assets

          # Settings file with centralized repositories
          cat << 'EOF' > simple_project/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Web2App"
          include ':app'
          EOF

          # Root build.gradle without duplicate repositories
          cat << 'EOF' > simple_project/build.gradle
          buildscript {
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20'
              }
          }
          EOF

          # App level build.gradle
          cat << 'EOF' > simple_project/app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'

          android {
              compileSdkVersion 34
              namespace 'com.satvik.engine'
              defaultConfig {
                  applicationId "${{ github.event.inputs.package_name }}"
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > simple_project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="${{ github.event.inputs.app_name }}"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name="com.satvik.engine.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Activity Layout
          cat << 'EOF' > simple_project/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent">
              <WebView android:id="@+id/webView" android:layout_width="match_parent" android:layout_height="match_parent" />
              <TextView android:id="@+id/cornerBadge" android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true" android:layout_alignParentEnd="true" android:layout_margin="12dp"
                  android:background="#80000000" android:padding="6dp" android:text="Built via Satvik" android:textColor="#FFFFFF" />
          </RelativeLayout>
          EOF

          # Copy Assets & Code
          cp android/assets/offline.html simple_project/app/src/main/assets/offline.html || true
          cp android/MainActivity.kt simple_project/app/src/main/java/com/satvik/engine/MainActivity.kt
          sed -i '1s/^package .*/package com.satvik.engine/' simple_project/app/src/main/java/com/satvik/engine/MainActivity.kt
          sed -i 's|TARGET_APP_URL|${{ github.event.inputs.app_url }}|g' simple_project/app/src/main/java/com/satvik/engine/MainActivity.kt

      - name: Build APK with Gradle
        run: |
          cd simple_project
          gradle assembleDebug --no-daemon

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-Release-APK
          path: simple_project/app/build/outputs/apk/debug/*.apk
