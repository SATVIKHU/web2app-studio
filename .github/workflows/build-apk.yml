name: Build Android APK Engine

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Target Website URL'
        required: true
        default: 'https://example.com'
      app_name:
        description: 'App Name'
        required: true
        default: 'PIKACHU'
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.satvik.app'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Project Directory
        run: |
          mkdir -p app/src/main/java/com/satvik/engine
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/assets

          cp android/MainActivity.kt app/src/main/java/com/satvik/engine/MainActivity.kt
          cp android/assets/offline.html app/src/main/assets/offline.html || true

          sed -i '1s/^package .*/package com.satvik.engine/' app/src/main/java/com/satvik/engine/MainActivity.kt
          sed -i 's|TARGET_APP_URL|${{ github.event.inputs.app_url }}|g' app/src/main/java/com/satvik/engine/MainActivity.kt

          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
          echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> settings.gradle
          echo "rootProject.name = 'Web2App'" >> settings.gradle
          echo "include ':app'" >> settings.gradle

          echo "plugins { id 'com.android.application' version '8.2.0' apply false; id 'org.jetbrains.kotlin.android' version '1.9.20' apply false }" > build.gradle

          echo "plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }" > app/build.gradle
          echo "android { namespace 'com.satvik.engine'; compileSdk 34; defaultConfig { applicationId '${{ github.event.inputs.package_name }}'; minSdk 21; targetSdk 34; versionCode 1; versionName '1.0' }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = '17' } }" >> app/build.gradle
          echo "dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.material:material:1.11.0' }" >> app/build.gradle

          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET" /><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" /><application android:allowBackup="true" android:label="${{ github.event.inputs.app_name }}" android:supportsRtl="true" android:theme="@style/Theme.AppCompat.NoActionBar"><activity android:name="com.satvik.engine.MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml

          echo '<?xml version="1.0" encoding="utf-8"?><RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent"><WebView android:id="@+id/webView" android:layout_width="match_parent" android:layout_height="match_parent" /><TextView android:id="@+id/cornerBadge" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_alignParentBottom="true" android:layout_alignParentEnd="true" android:layout_margin="12dp" android:background="#80000000" android:paddingHorizontal="10dp" android:paddingVertical="5dp" android:text="Built via Satvik" android:textColor="#FFFFFF" android:textSize="12sp" /></RelativeLayout>' > app/src/main/res/layout/activity_main.xml

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-Release-APK
          path: app/build/outputs/apk/debug/*.apk
