name: Build Android APK Engine

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Target Website URL'
        required: true
        default: 'https://example.com'
      app_name:
        description: 'App Name'
        required: true
        default: 'PIKACHU'
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.satvik.app'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Professional Android Project
        run: |
          mkdir -p simple_project/app/src/main/java/com/satvik/engine
          mkdir -p simple_project/app/src/main/res/layout
          mkdir -p simple_project/app/src/main/assets

          # 1. settings.gradle
          cat << 'EOF' > simple_project/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id 'com.android.application' version '8.1.4' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Web2App"
          include ':app'
          EOF

          # 2. root build.gradle
          touch simple_project/build.gradle

          # 3. app/build.gradle
          cat << 'EOF' > simple_project/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              compileSdk 34
              namespace 'com.satvik.engine'
              defaultConfig {
                  applicationId "${{ github.event.inputs.package_name }}"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > simple_project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="${{ github.event.inputs.app_name }}"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name="com.satvik.engine.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 5. Activity Layout
          cat << 'EOF' > simple_project/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent">
              <WebView android:id="@+id/webView" android:layout_width="match_parent" android:layout_height="match_parent" />
              <TextView android:id="@+id/cornerBadge" android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true" android:layout_alignParentEnd="true" android:layout_margin="12dp"
                  android:background="#80000000" android:padding="6dp" android:text="Built via Satvik" android:textColor="#FFFFFF" />
          </RelativeLayout>
          EOF

          # 6. MainActivity.kt (Suppressed deprecations for flawless compilation)
          cat << 'EOF' > simple_project/app/src/main/java/com/satvik/engine/MainActivity.kt
          package com.satvik.engine

          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val webView = findViewById<WebView>(R.id.webView)
                  webView.settings.javaScriptEnabled = true
                  webView.webViewClient = WebViewClient()
                  webView.loadUrl("TARGET_APP_URL")
              }

              @Suppress("DEPRECATION")
              override fun onBackPressed() {
                  val webView = findViewById<WebView>(R.id.webView)
                  if (webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          EOF

          # Replace placeholder with user url
          sed -i 's|TARGET_APP_URL|${{ github.event.inputs.app_url }}|g' simple_project/app/src/main/java/com/satvik/engine/MainActivity.kt

      - name: Build with Official Gradle Wrapper
        run: |
          cd simple_project
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-Release-APK
          path: simple_project/app/build/outputs/apk/debug/*.apk
          
