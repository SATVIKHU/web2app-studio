name: Build Android APK Engine

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Target Website URL'
        required: true
        default: 'https://example.com'
      app_name:
        description: 'App Name'
        required: true
        default: 'PIKACHU'
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.satvik.app'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inject Custom Configurations & Security Rules
        run: |
          echo "Injecting App Parameters..."
          sed -i 's|TARGET_APP_URL|${{ github.event.inputs.app_url }}|g' android/MainActivity.kt

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-Release-APK
          path: android/*.kt
