<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Internet Connection</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f8fafc; color: #334155; text-align: center; padding: 20px; }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        p { font-size: 14px; color: #64748b; margin-bottom: 24px; }
        button { background-color: #2563eb; color: white; border: none; padding: 12px 24px; font-size: 14px; font-weight: 600; border-radius: 12px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="icon">📡</div>
    <h1>Connection Lost</h1>
    <p>Please check your internet connection and try again.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
</body>
</html>
